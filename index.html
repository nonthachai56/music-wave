<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คลื่นเพลง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0714;
    --pink: #ff4fa3;
    --violet: #9b5cff;
    --blue: #3f8cff;
    --cyan: #3fe8ff;
    --text: #f3eeff;
    --muted: #a59bc4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Kanit", "Leelawadee UI", Tahoma, sans-serif;
    font-weight: 300;
    color: var(--text);
    background:
      radial-gradient(60% 50% at 20% 15%, rgba(255, 79, 163, .22), transparent 70%),
      radial-gradient(55% 50% at 85% 80%, rgba(63, 232, 255, .18), transparent 70%),
      radial-gradient(50% 45% at 60% 30%, rgba(155, 92, 255, .20), transparent 70%),
      var(--ink);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .stage {
    position: fixed; inset: 0 0 150px 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .disc {
    --size: min(42vw, 36vh, 230px);
    width: var(--size); height: var(--size);
    border-radius: 50%;
    padding: calc(var(--size) * .045);
    background: linear-gradient(160deg, #ffffff, #d9d4e6);
    box-shadow: 0 0 60px rgba(155, 92, 255, .55), 0 0 140px rgba(63, 232, 255, .25);
    will-change: transform;
  }
  .disc-inner {
    width: 100%; height: 100%; border-radius: 50%;
    display: grid; place-items: center;
    background:
      radial-gradient(circle at 25% 20%, #ff8a5c 0%, transparent 45%),
      radial-gradient(circle at 20% 75%, #ff4fa3 0%, transparent 55%),
      radial-gradient(circle at 80% 85%, #3fe8ff 0%, transparent 55%),
      radial-gradient(circle at 80% 20%, #9b5cff 0%, transparent 60%),
      #3f8cff;
  }
  .disc svg { width: 52%; height: 52%; filter: drop-shadow(0 4px 10px rgba(40, 0, 90, .35)); }

  .panel {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    width: min(560px, calc(100% - 28px));
    padding: 16px 18px;
    border-radius: 22px;
    background: rgba(22, 16, 44, .62);
    border: 1px solid rgba(255, 255, 255, .12);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .title {
    flex: 1; min-width: 0;
    font-size: 1.05rem; font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .title.empty { color: var(--muted); font-weight: 300; }

  button, .pick {
    font: inherit; color: var(--text); cursor: pointer; border: 0;
  }
  .play {
    width: 46px; height: 46px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--pink), var(--violet) 55%, var(--blue));
    box-shadow: 0 6px 22px rgba(155, 92, 255, .5);
    transition: transform .15s;
  }
  .play:active { transform: scale(.93); }
  .play:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  .play svg { width: 18px; height: 18px; fill: #fff; }
  .pick {
    flex: none; padding: 9px 16px; border-radius: 999px; font-weight: 400; font-size: .95rem;
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .18);
  }
  .pick:hover { background: rgba(255, 255, 255, .18); }
  button:focus-visible, .pick:focus-within, input[type=range]:focus-visible {
    outline: 2px solid var(--cyan); outline-offset: 3px;
  }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .seek { margin-top: 12px; }
  .time { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 36px; }
  .time:last-child { text-align: right; }
  input[type=range] {
    flex: 1; height: 5px; border-radius: 3px; cursor: pointer;
    -webkit-appearance: none; appearance: none;
    background: linear-gradient(90deg, var(--pink), var(--violet), var(--cyan)) 0 / var(--p, 0%) 100% no-repeat,
                rgba(255, 255, 255, .16);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px var(--cyan);
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 50%;
    background: #fff; box-shadow: 0 0 10px var(--cyan);
  }

  .sources { margin-top: 14px; flex-wrap: wrap; gap: 8px; }
  .pick.on { background: linear-gradient(135deg, var(--pink), var(--violet) 55%, var(--blue)); border-color: transparent; }
  .link {
    flex: 1; min-width: 150px; padding: 9px 14px; border-radius: 999px;
    font: inherit; font-size: .95rem; color: var(--text);
    background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .18);
  }
  .link::placeholder { color: var(--muted); }
  .link:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .yt { position: fixed; top: 12px; right: 12px; width: 200px; text-align: right; }
  .yt[hidden] { display: none; }
  .yt-frame {
    aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000;
    border: 1px solid rgba(255, 255, 255, .18); box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
  .yt-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .yt .pick { margin-top: 6px; padding: 3px 12px; font-size: .78rem; background: rgba(22, 16, 44, .7); }

  .lyrics {
    margin-top: 14px; padding: 4px 6px 2px; max-height: min(24vh, 200px); overflow-y: auto;
    text-align: center; white-space: pre-line; line-height: 1.75; font-size: .95rem;
    scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .25) transparent;
  }
  .lyrics[hidden] { display: none; }
  .song { font-weight: 500; font-size: 1.1rem; margin-bottom: 6px; white-space: normal; }

  .kara { position: fixed; left: 0; right: 0; padding: 0 18px; text-align: center; }
  .kara[hidden], .k-ctl[hidden] { display: none; }
  .k-cur {
    display: inline-block; font-weight: 500; line-height: 1.35;
    font-size: clamp(1.35rem, 3.6vw, 2.3rem);
    background: linear-gradient(90deg, var(--cyan) 0%, var(--pink) var(--kp, 0%), #fff var(--kp, 0%));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .7));
  }
  .k-next { min-height: 1.7em; margin-top: 2px; color: var(--muted); font-size: clamp(.95rem, 2vw, 1.15rem); }
  .k-ctl { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .k-ctl .pick { padding: 5px 14px; font-size: .85rem; }

  .drop {
    position: fixed; inset: 14px; border-radius: 26px;
    border: 2px dashed var(--cyan); background: rgba(10, 7, 20, .7);
    display: none; place-items: center; font-size: 1.4rem; font-weight: 400;
  }
  body.dragging .drop { display: grid; }
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>

<div class="stage">
  <div class="disc" id="disc">
    <div class="disc-inner">
      <svg viewBox="0 0 100 100" role="img" aria-label="โน้ตดนตรี">
        <path fill="#fff" d="M38 20 L82 10 V66 a13 11 0 1 1 -8 -10 V30 L46 36 V76 a13 11 0 1 1 -8 -10 Z"/>
      </svg>
    </div>
  </div>
</div>

<div class="panel">
  <div class="row">
    <button class="play" id="play" disabled aria-label="เล่น">
      <svg id="icon" viewBox="0 0 24 24"><path d="M7 4v16l14-8z"/></svg>
    </button>
    <div class="title empty" id="title">เลือกเพลง เปิดไมค์ หรือจับเสียงจากแท็บ YouTube</div>
  </div>
  <div class="row seek">
    <span class="time" id="cur">0:00</span>
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="ตำแหน่งเพลง">
    <span class="time" id="dur">0:00</span>
  </div>
  <div class="row sources">
    <label class="pick">เลือกเพลง<input type="file" id="file" accept="audio/*"></label>
    <button class="pick" id="mic" aria-pressed="false">เปิดไมค์</button>
    <button class="pick" id="tabBtn" aria-pressed="false">จับเสียงจากแท็บ YouTube</button>
  </div>
  <div class="row sources">
    <input class="link" id="q" type="text" placeholder="วางลิงก์ YouTube หรือพิมพ์ชื่อเพลง" aria-label="ลิงก์ YouTube หรือชื่อเพลง">
    <button class="pick" id="qGo">หาเนื้อเพลง</button>
  </div>
  <div class="lyrics" id="lyrics" hidden>
    <div class="song" id="song"></div>
    <div id="lyText"></div>
  </div>
</div>



<div class="kara" id="kara" hidden>
  <div><span class="k-cur" id="kCur"></span></div>
  <div class="k-next" id="kNext"></div>
  <div class="k-ctl" id="kCtl">
    <button class="pick" id="kSync">เริ่มร้องท่อนแรก</button>
    <button class="pick" id="kBack" aria-label="เลื่อนเนื้อเพลงให้ช้าลงครึ่งวินาที">เนื้อช้าลง</button>
    <button class="pick" id="kFwd" aria-label="เลื่อนเนื้อเพลงให้เร็วขึ้นครึ่งวินาที">เนื้อเร็วขึ้น</button>
  </div>
</div>

<div class="drop">วางไฟล์เพลงตรงนี้</div>

<script>
(function () {
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var disc = document.getElementById('disc');
  var playBtn = document.getElementById('play'), icon = document.getElementById('icon');
  var titleEl = document.getElementById('title'), fileEl = document.getElementById('file');
  var seek = document.getElementById('seek'), curEl = document.getElementById('cur'), durEl = document.getElementById('dur');

  var audio = new Audio();
  var actx = null, analyser = null, freq = null, wave = null;
  var BARS = 128, levels = new Float32Array(BARS), bass = 0;
  var W = 0, H = 0, dpr = 1, seeking = false, panelTop = 0, peak = 90, wpeak = 0.04, energy = 0, kH = 0, quiet = 0, lastT = performance.now();
  var panel = document.querySelector('.panel');
  var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- เสียง ----------
  function setupAudio() {
    if (actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    analyser = actx.createAnalyser();
    analyser.fftSize = 4096;
    analyser.smoothingTimeConstant = 0.8;
    var src = actx.createMediaElementSource(audio);
    src.connect(analyser);
    src.connect(actx.destination);
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
  }

  function loadFile(f) {
    if (!f) return;
    if (f.type.indexOf('audio') !== 0) {
      titleEl.textContent = 'ไฟล์นี้ไม่ใช่ไฟล์เสียง ลองเลือก mp3, wav หรือ m4a';
      titleEl.classList.add('empty');
      return;
    }
    setupAudio();
    stopMic(); stopTab();
    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(f);
    titleEl.textContent = f.name.replace(/\.[^.]+$/, '');
    titleEl.classList.remove('empty');
    playBtn.disabled = false;
    play();
  }

  function play() {
    if (actx.state === 'suspended') actx.resume();
    audio.play().catch(function () {});
  }

  function setIcon(playing) {
    icon.innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l14-8z"/>';
    playBtn.setAttribute('aria-label', playing ? 'หยุดชั่วคราว' : 'เล่น');
  }

  function fmt(s) {
    if (!isFinite(s)) return '0:00';
    var m = Math.floor(s / 60), x = Math.floor(s % 60);
    return m + ':' + (x < 10 ? '0' : '') + x;
  }

  playBtn.onclick = function () { audio.paused ? play() : audio.pause(); };
  fileEl.onchange = function () { loadFile(fileEl.files[0]); };
  audio.onplay = function () { setIcon(true); };
  audio.onpause = function () { setIcon(false); };
  audio.onended = function () { setIcon(false); };
  audio.onloadedmetadata = function () { durEl.textContent = fmt(audio.duration); };
  audio.ontimeupdate = function () {
    if (seeking || !audio.duration) return;
    var p = audio.currentTime / audio.duration;
    seek.value = p * 1000;
    seek.style.setProperty('--p', (p * 100) + '%');
    curEl.textContent = fmt(audio.currentTime);
  };
  seek.oninput = function () {
    seeking = true;
    seek.style.setProperty('--p', (seek.value / 10) + '%');
    if (audio.duration) curEl.textContent = fmt(seek.value / 1000 * audio.duration);
  };
  seek.onchange = function () {
    if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
    seeking = false;
  };

  function say(text, muted) {
    titleEl.textContent = text;
    titleEl.classList.toggle('empty', !!muted);
  }

  // ---------- ไมค์ ----------
  var micBtn = document.getElementById('mic');
  var micOn = false, micStream = null, micNode = null, micGain = null;

  function startMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      say('เบราว์เซอร์นี้ใช้ไมค์ไม่ได้ ลองเปิดด้วย Chrome', true);
      return;
    }
    setupAudio();
    if (actx.state === 'suspended') actx.resume();
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    }).then(function (stream) {
      if (actx.state === 'suspended') actx.resume();
      micStream = stream;
      micNode = actx.createMediaStreamSource(stream);
      micGain = actx.createGain();
      micGain.gain.value = 2.5;
      micNode.connect(micGain);
      micGain.connect(analyser);   // ต่อเข้าตัววิเคราะห์อย่างเดียว ไม่ออกลำโพง เสียงจึงไม่หอน
      analyser.minDecibels = -70; analyser.maxDecibels = -20;   // ตัดเสียงรบกวนเบาๆ รอบห้อง
      analyser.smoothingTimeConstant = 0.7;
      peak = 90;
      micOn = true;
      audio.pause();
      micBtn.classList.add('on');
      micBtn.textContent = 'ปิดไมค์';
      micBtn.setAttribute('aria-pressed', 'true');
      say('กำลังฟังเสียงจากไมค์');
    }).catch(function (err) {
      var n = err && err.name;
      if (n === 'NotFoundError' || n === 'OverconstrainedError') say('ไม่พบไมค์ในเครื่องนี้ ต่อไมค์ก่อน หรือใช้ปุ่มเลือกเพลงแทน', true);
      else if (n === 'NotReadableError') say('ไมค์ถูกโปรแกรมอื่นใช้อยู่ ปิดโปรแกรมนั้นแล้วลองอีกครั้ง', true);
      else say('ยังไม่ได้อนุญาตไมค์ กดไอคอนหน้าแถบที่อยู่แล้วเลือกอนุญาตไมโครโฟน', true);
    });
  }

  function stopMic() {
    if (!micOn) return;
    micStream.getTracks().forEach(function (tr) { tr.stop(); });
    micNode.disconnect(); micGain.disconnect();
    micOn = false;
    analyser.maxDecibels = -30; analyser.minDecibels = -100;
    analyser.smoothingTimeConstant = 0.8;
    peak = 90;
    micBtn.classList.remove('on');
    micBtn.textContent = 'เปิดไมค์';
    micBtn.setAttribute('aria-pressed', 'false');
  }

  micBtn.onclick = function () {
    if (micOn) { stopMic(); say('ปิดไมค์แล้ว', true); }
    else startMic();
  };

  // ---------- เสียงจากแท็บอื่น (เช่น แท็บ YouTube ที่เปิดแยกไว้) ----------
  // จับเสียงโดยตรง ไม่ผ่านไมค์ และไม่ต้องฝังวิดีโอไว้ในหน้านี้
  var tabBtn = document.getElementById('tabBtn');
  var tabOn = false, tabStream = null, tabNode = null;

  function startTab() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
      say('เบราว์เซอร์นี้จับเสียงจากแท็บไม่ได้ ใช้ Chrome หรือ Edge บนคอมพิวเตอร์', true);
      return;
    }
    setupAudio();
    if (actx.state === 'suspended') actx.resume();
    say('เลือกแท็บ YouTube แล้วเปิด "แชร์เสียงของแท็บด้วย"', true);
    navigator.mediaDevices.getDisplayMedia({
      video: true, audio: true, selfBrowserSurface: 'exclude', systemAudio: 'include'
    }).then(function (stream) {
      if (!stream.getAudioTracks().length) {
        stream.getTracks().forEach(function (tr) { tr.stop(); });
        say('ไม่ได้รับเสียง กดอีกครั้งแล้วเปิด "แชร์เสียงของแท็บด้วย"', true);
        return;
      }
      stopMic();
      audio.pause();
      tabStream = stream;
      tabNode = actx.createMediaStreamSource(stream);
      tabNode.connect(analyser);
      tabOn = true;
      peak = 90;
      stream.getAudioTracks()[0].onended = function () { stopTab(); say('หยุดจับเสียงจากแท็บแล้ว', true); };
      tabBtn.classList.add('on');
      tabBtn.textContent = 'หยุดจับเสียงแท็บ';
      tabBtn.setAttribute('aria-pressed', 'true');
      say('กำลังจับเสียงจากแท็บ YouTube');
    }).catch(function (err) {
      if (err && err.name === 'NotAllowedError' && !/policy|permission/i.test(err.message || '')) say('ยกเลิกการแชร์แล้ว', true);
      else say('จับเสียงจากแท็บไม่ได้ หน้านี้อาจถูกบล็อกสิทธิ์แชร์หน้าจอ', true);
    });
  }

  function stopTab() {
    if (!tabOn) return;
    tabStream.getTracks().forEach(function (tr) { tr.stop(); });
    tabNode.disconnect();
    tabOn = false;
    tabBtn.classList.remove('on');
    tabBtn.textContent = 'จับเสียงจากแท็บ YouTube';
    tabBtn.setAttribute('aria-pressed', 'false');
  }

  tabBtn.onclick = function () {
    if (tabOn) { stopTab(); say('หยุดจับเสียงจากแท็บแล้ว', true); }
    else startTab();
  };

  // ---------- ชื่อเพลงและเนื้อเพลง ----------
  var qEl = document.getElementById('q'), lyBox = document.getElementById('lyrics');
  var songEl = document.getElementById('song'), lyText = document.getElementById('lyText');

  // ตัดคำอย่าง [Official MV] ออกจากชื่อคลิป เพื่อให้ค้นเนื้อเพลงเจอง่ายขึ้น
  function cleanTitle(t) {
    return t.replace(/[\[\(【「].*?[\]\)】」]/g, ' ')
            .replace(/official|music video|\bmv\b|lyrics?|audio|visualizer|\bhd\b|\b4k\b/ig, ' ')
            .replace(/[|｜]/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function showLyrics(song, text) {
    lyBox.hidden = false;
    songEl.textContent = song;
    lyText.textContent = text;
    lyBox.scrollTop = 0;
    resize();
  }

  function findSong() {
    var q = qEl.value.trim();
    if (!q) { showLyrics('วางลิงก์ YouTube หรือพิมพ์ชื่อเพลงก่อน', ''); return; }
    var isLink = /^https?:\/\//i.test(q), shown = q;
    stopKaraoke();
    showLyrics('กำลังค้นหา…', '');
    var name = isLink
      ? fetch('https://noembed.com/embed?url=' + encodeURIComponent(q))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (!d.title) throw new Error('no title');
            shown = d.title;
            showLyrics(shown, 'กำลังหาเนื้อเพลง…');
            return cleanTitle(d.title);
          })
      : Promise.resolve(q);
    name.then(function (n) {
      return fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(n)).then(function (r) { return r.json(); });
    }).then(function (list) {
      var hit = null;
      var i, lines = null;
      for (i = 0; list && i < list.length; i++) if (list[i].syncedLyrics) { hit = list[i]; break; }
      if (hit) lines = parseLrc(hit.syncedLyrics);
      if (!lines || !lines.length) {
        lines = null; hit = null;
        for (i = 0; list && i < list.length; i++) if (list[i].plainLyrics) { hit = list[i]; break; }
      }
      if (hit && lines) {
        showLyrics(hit.trackName + ' · ' + hit.artistName, '');
        startKaraoke(lines);
      } else if (hit) {
        showLyrics(hit.trackName + ' · ' + hit.artistName + ' (เพลงนี้ไม่มีเนื้อแบบจับเวลา)', hit.plainLyrics);
      }
      else showLyrics(shown, 'ไม่พบเนื้อเพลงของเพลงนี้ ลองพิมพ์ชื่อเพลงกับชื่อศิลปินเองแล้วค้นอีกครั้ง');
    }).catch(function () {
      showLyrics(isLink && shown === q ? 'อ่านชื่อเพลงจากลิงก์ไม่ได้' : shown,
                 'ค้นหาไม่สำเร็จ ตรวจลิงก์หรืออินเทอร์เน็ตแล้วลองอีกครั้ง');
    });
  }

  document.getElementById('qGo').onclick = findSong;
  qEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') findSong(); });

  // ---------- คาราโอเกะ ----------
  var kara = document.getElementById('kara'), kCur = document.getElementById('kCur');
  var kNext = document.getElementById('kNext'), kCtl = document.getElementById('kCtl');
  var kLines = null, kIdx = -2, kTime = 0, kRun = false;

  // แปลงเนื้อเพลงแบบจับเวลา "[01:23.45] เนื้อร้อง" เป็นรายการ {t: วินาที, s: ข้อความ}
  function parseLrc(text) {
    var out = [];
    text.split('\n').forEach(function (row) {
      var m = row.match(/^\[(\d+):(\d+(?:\.\d+)?)\]\s*(.*)$/);
      if (m) out.push({ t: (+m[1]) * 60 + (+m[2]), s: m[3].trim() });
    });
    return out;
  }

  function startKaraoke(lines) {
    kLines = lines; kIdx = -2; kTime = 0; kRun = false;
    kara.hidden = false;
    resize();
  }

  function stopKaraoke() {
    kLines = null;
    kara.hidden = true;
    resize();
  }

  function updateKaraoke(dt) {
    if (!kLines) return;
    // ไฟล์เพลงในเครื่อง: รู้เวลาเล่นจริง จึงตรงเองอัตโนมัติ
    // แท็บ YouTube หรือไมค์: ไม่รู้เวลาเล่น ต้องให้ผู้ใช้กดบอกจังหวะเริ่ม แล้วนับเวลาเอง
    var fileMode = !!audio.src && !tabOn && !micOn;
    if (kCtl.hidden !== fileMode) { kCtl.hidden = fileMode; resize(); }
    if (fileMode) kTime = audio.currentTime;
    else if (kRun && !(tabOn && quiet > 30)) kTime += dt;   // แท็บเงียบสนิท = วิดีโอหยุด ก็หยุดนับด้วย
    var started = fileMode || kRun, idx = -1, j;
    if (started) for (j = 0; j < kLines.length; j++) { if (kLines[j].t <= kTime) idx = j; else break; }
    if (idx !== kIdx) {
      kIdx = idx;
      kCur.textContent = idx < 0 ? (started ? '♪' : 'กด "เริ่มร้องท่อนแรก" ตอนนักร้องเริ่มร้อง') : (kLines[idx].s || '♪');
      var nx = kLines[idx + 1];
      kNext.textContent = nx ? (nx.s || '♪') : '';
    }
    var p = 0;
    if (idx >= 0) {
      var t0 = kLines[idx].t, t1 = kLines[idx + 1] ? kLines[idx + 1].t : t0 + 5;
      p = Math.min(1, (kTime - t0) / Math.max(0.5, Math.min(t1 - t0, 8)));
    }
    kCur.style.setProperty('--kp', (p * 100).toFixed(1) + '%');
  }

  document.getElementById('kSync').onclick = function () {
    if (!kLines) return;
    var first = 0;
    for (var j = 0; j < kLines.length; j++) if (kLines[j].s) { first = kLines[j].t; break; }
    kTime = first; kRun = true; kIdx = -2;
  };
  document.getElementById('kBack').onclick = function () { kTime = Math.max(0, kTime - 0.5); };
  document.getElementById('kFwd').onclick = function () { kTime += 0.5; };

  // เปิดหน้าเว็บแล้วขออนุญาตใช้ไมค์ทันที
  window.addEventListener('pointerdown', function () {
    if (actx && actx.state === 'suspended') actx.resume();
  });
  startMic();

  // ลากไฟล์มาวาง
  var dragDepth = 0;
  window.addEventListener('dragenter', function (e) { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', function () { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    loadFile(e.dataTransfer.files[0]);
  });

  // ---------- ภาพ ----------
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    panelTop = panel.getBoundingClientRect().top;
    kara.style.bottom = (H - panelTop + 8) + 'px';
    kH = kara.hidden ? 0 : kara.offsetHeight + 10;
    disc.parentElement.style.bottom = (H - panelTop + 10 + kH) + 'px';
    // ย่อไอคอนเมื่อพื้นที่ด้านบนเหลือน้อย
    var room = panelTop - 10 - kH;
    disc.style.setProperty('--size', Math.max(80, Math.min(230, W * 0.42, room * 0.5)) + 'px');
  }
  window.addEventListener('resize', resize);
  resize();

  // สีไล่ตามวง: ส้ม → ชมพู → ม่วง → ฟ้า → ฟ้าอมเขียว
  function hue(t) { return 20 - t * 200; }

  function frame(now) {
    var t = now / 1000;
    var live = analyser && (!audio.paused || micOn || tabOn);
    var i, target;

    if (live) {
      analyser.getByteFrequencyData(freq);
      analyser.getByteTimeDomainData(wave);
      // ปรับความไวอัตโนมัติ: เทียบกับเสียงที่ดังที่สุดช่วงล่าสุด เสียงเบาก็ยังขยับชัด
      var mx = 0, dv = 0, lim = Math.floor(freq.length * 0.6);
      for (i = 1; i < lim; i++) if (freq[i] > mx) mx = freq[i];
      peak = Math.max(peak * 0.995, mx, 90);
      for (i = 0; i < wave.length; i += 4) dv = Math.max(dv, Math.abs(wave[i] - 128) / 128);
      wpeak = Math.max(wpeak * 0.99, dv, 0.04);
      quiet = mx < 5 ? quiet + 1 : 0;
    }

    // ระดับเสียงของแต่ละแท่ง (สมมาตรซ้าย-ขวา)
    var half = BARS / 2, b = 0, mean = 0, floor = 0;
    var hz = live ? actx.sampleRate / analyser.fftSize : 1;
    var gate = live && mx >= 45;               // เงียบ = ไม่มีคลื่น
    energy += ((live ? dv : 0) - energy) * 0.15;
    if (gate) {
      for (i = 1; i < lim; i++) mean += freq[i];
      mean /= lim;
      floor = Math.min(mean * 1.1, peak * 0.6);  // ตัดพื้นเสียงออก เหลือแต่โน้ตที่เด่น
    }
    for (i = 0; i < half; i++) {
      target = 0;
      if (gate) {
        // แบ่งย่านความถี่แบบเดียวกับที่หูได้ยิน: 40 Hz (เบส) ไล่ขึ้นไปถึง 8,000 Hz (เสียงแหลม)
        var lo = Math.max(1, Math.floor(40 * Math.pow(200, i / half) / hz));
        var hi = Math.max(lo + 1, Math.floor(40 * Math.pow(200, (i + 1) / half) / hz));
        var v = 0, k;
        for (k = lo; k < hi && k < freq.length; k++) if (freq[k] > v) v = freq[k];
        v *= 1 + 0.5 * i / half;                 // ชดเชยเสียงแหลมที่ปกติเบากว่าเบส
        target = Math.pow(Math.min(1, Math.max(0, (v - floor) / (peak - floor))), 1.5);
      }
      levels[i] += (target - levels[i]) * (target > levels[i] ? 0.6 : 0.14);
      levels[BARS - 1 - i] = levels[i];
      if (i < 10) b += levels[i];
    }
    bass += (b / 10 - bass) * 0.35;

    updateKaraoke((now - lastT) / 1000);
    lastT = now;

    ctx.clearRect(0, 0, W, H);

    var rect = disc.parentElement.getBoundingClientRect();
    var cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
    var r0 = disc.offsetWidth / 2;
    var scale = 1 + bass * 0.2;
    disc.style.transform = 'scale(' + scale.toFixed(3) + ')';

    var inner = r0 * scale + 12;
    var maxLen = Math.max(40, Math.min(W, rect.height) / 2 - inner - 8);

    // วงแสงกระเพื่อมตามเบส
    var glow = ctx.createRadialGradient(cx, cy, inner, cx, cy, inner + maxLen * (0.6 + bass));
    glow.addColorStop(0, 'rgba(155, 92, 255,' + (bass * 0.45) + ')');
    glow.addColorStop(1, 'rgba(155, 92, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, inner + maxLen * 1.6, 0, Math.PI * 2); ctx.fill();

    // แท่งคลื่นรอบวง
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(2, (2 * Math.PI * inner) / BARS * 0.55);
    ctx.shadowBlur = 14;
    var spin = 0;   // ไม่หมุน: เบสอยู่ล่าง เสียงแหลมอยู่บน
    for (i = 0; i < BARS; i++) {
      var a = (i / BARS) * Math.PI * 2 + Math.PI / 2 + spin;
      if (levels[i] < 0.015) continue;
      var len = 3 + levels[i] * maxLen;
      var c = 'hsl(' + hue(i < half ? i / half : (BARS - i) / half) + ', 100%, ' + (58 + levels[i] * 14) + '%)';
      var ca = Math.cos(a), sa = Math.sin(a);
      ctx.strokeStyle = c; ctx.shadowColor = c;
      ctx.beginPath();
      ctx.moveTo(cx + ca * inner, cy + sa * inner);
      ctx.lineTo(cx + ca * (inner + len), cy + sa * (inner + len));
      ctx.stroke();
    }

    // เส้นคลื่นเสียงด้านล่าง
    var wy = panelTop - 40 - kH, amp = Math.min(60, H * 0.07);
    var grad = ctx.createLinearGradient(0, 0, W, 0);
    grad.addColorStop(0, 'rgba(255, 79, 163, 0)');
    grad.addColorStop(0.2, '#ff4fa3');
    grad.addColorStop(0.5, '#9b5cff');
    grad.addColorStop(0.8, '#3fe8ff');
    grad.addColorStop(1, 'rgba(63, 232, 255, 0)');
    ctx.strokeStyle = grad; ctx.shadowColor = '#9b5cff'; ctx.shadowBlur = 16;
    ctx.lineWidth = 2.5; ctx.globalAlpha = Math.min(0.85, Math.max(0, energy - 0.01) * 12);
    ctx.beginPath();
    var pts = 160;
    for (i = 0; i <= pts; i++) {
      var x = (i / pts) * W, v;
      if (live) v = (wave[Math.floor((i / pts) * (wave.length - 1))] - 128) / 128 / wpeak * 0.55;
      else v = 0;
      var y = wy + v * amp * 1.6;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
